<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | LDL Fitness</title>

    <!-- 1. Favicon -->
    <link rel="shortcut icon" href="img/logo.webp" type="image/x-icon">

    <!-- 2. Pré-conexão Google Fonts (Otimização) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <!-- 3. Fontes Unificadas em um único link (Inter, Oswald e Poppins) -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&family=Oswald:wght@500;700&family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- 4. Ícones Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <!-- 5. CSS da Página (Carregado por último para aplicar as fontes corretamente) -->
    <link rel="stylesheet" href="css/login.css">
</head>
<body>
    <div class="container">
        <div class="decoration">
            <div class="circle circle-1"></div>
            <div class="circle circle-2"></div>
            <div class="circle circle-3"></div>
        </div>

        <div class="login-wrapper">
            <div class="header">
                <div class="logo">
                    <img src="img/logo.webp" alt="Logo LDL Fitness"> 
                    <span>LDL FITNESS</span>
                </div>
                <h1>Área do Aluno</h1>
                <p class="subtitle">Entre com suas credenciais para acessar seu treino</p>
            </div>

            <form class="login-form" id="loginform">
                <div class="input-group">
                    <label for="email">
                        <i class="fas fa-envelope"></i> Email
                    </label>
                    <input type="email" id="email" placeholder="seu.email@exemplo.com" required>
                    <div class="underline"></div>
                </div>

                <div class="input-group">
                    <label for="password">
                        <i class="fas fa-lock"></i> Senha
                    </label>
                    <div class="password-wrapper">
                        <input type="password" id="password" placeholder="Sua senha" required>
                        <div class="password-toggle">
                            <i class="fas fa-eye" id="togglePassword"></i>
                        </div>
                    </div>
                    <div class="underline"></div>
                </div>

                <div class="options">
                    <label class="remember">
                        <input type="checkbox" id="remember">
                        <span>Lembrar-me</span>
                    </label>
                    <a href="#" class="forgot-password">Esqueceu a senha?</a>
                </div>

                <a href="aluno-painel.html" class="login-btn">
                    <i class="fas fa-sign-in-alt"></i> Entrar
             </a>

                <a href="index.html" class="btn-back-outline"> 
                    <i class="fas fa-arrow-left"></i> Voltar 
                </a>
                
                <div class="divider">
                    <span>ou</span>
                </div>

                <p class="register-link">
                    Não tem uma conta?
                    <a href="cadastro.html" id="registerLink">Faça sua matrícula</a>
                </p>
            </form>

            <div class="footer">
                <p>© 2026 LDL Fitness. Todos os direitos reservados.</p>
                <div class="social-links">
                    <a href="instagram.html"><i class="fab fa-instagram"></i></a>
                    <a href="whatsapp.html"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
            
        </div> 
    </div> 
<script src="js/main.js" defer></script>
<script src="js/login.js" defer></script>
    </body>
</html>
